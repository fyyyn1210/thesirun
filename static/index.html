<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ThesiRun</title>
  <link rel="stylesheet" href="/app.css">
  <script src="/app.js" defer></script>
</head>
<body class="min-h-dvh bg-neutral-950 text-neutral-100 font-sans">
  <main class="mx-auto max-w-md px-4 py-10">
    <h1 class="text-4xl font-black tracking-tight">ThesiRun</h1>
    <p class="mt-2 text-neutral-400">Share your thesis like a run.</p>

    <section class="mt-8 grid grid-cols-2 gap-3">
      <div class="rounded-2xl bg-neutral-900 p-4">
        <div class="text-sm text-neutral-400">🇮🇩 Indonesia</div>
        <div id="n-ID" class="mt-1 text-3xl font-bold">0</div>
        <div class="text-xs text-neutral-500">runners</div>
      </div>
      <div class="rounded-2xl bg-neutral-900 p-4">
        <div class="text-sm text-neutral-400">🇮🇳 India</div>
        <div id="n-IN" class="mt-1 text-3xl font-bold">0</div>
        <div class="text-xs text-neutral-500">runners</div>
      </div>
    </section>
  </main>
</body>
</html>
